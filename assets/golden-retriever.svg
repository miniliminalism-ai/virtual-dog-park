<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200"
     role="img" aria-labelledby="goldenTitle goldenDesc">
  <title id="goldenTitle">Illustration of a Golden Retriever</title>
  <desc id="goldenDesc">A simple cartoon drawing of a golden retriever's head: soft golden fur,
  neater ears folded down the sides of the head, a pale muzzle and a happy open mouth.</desc>

  <!-- background -->
  <rect width="200" height="200" fill="#eef5fb"/>
  <circle cx="100" cy="104" r="82" fill="#dbe9f6"/>

  <!-- ears, folded down the sides -->
  <ellipse cx="54" cy="108" rx="18" ry="36" fill="#c9922f"/>
  <ellipse cx="146" cy="108" rx="18" ry="36" fill="#c9922f"/>

  <!-- head -->
  <ellipse cx="100" cy="98" rx="50" ry="48" fill="#e9b96b"/>

  <!-- fluffy fur on top of the head -->
  <circle cx="74" cy="58" r="12" fill="#f2cd8d"/>
  <circle cx="100" cy="50" r="13" fill="#f2cd8d"/>
  <circle cx="126" cy="58" r="12" fill="#f2cd8d"/>

  <!-- pale muzzle -->
  <ellipse cx="100" cy="126" rx="30" ry="23" fill="#f6dcae"/>

  <!-- nose -->
  <ellipse cx="100" cy="113" rx="11" ry="8.5" fill="#3a2f2a"/>
  <ellipse cx="96" cy="110" rx="3" ry="2" fill="#7d716a"/>

  <!-- happy open mouth with a tongue -->
  <path d="M100 124v7" stroke="#3a2f2a" stroke-width="2.5" fill="none"/>
  <path d="M86 130q14 12 28 0" stroke="#3a2f2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="100" cy="139" rx="9" ry="7" fill="#e08a8a"/>

  <!-- eyes -->
  <circle cx="78" cy="90" r="6.5" fill="#4a3527"/>
  <circle cx="122" cy="90" r="6.5" fill="#4a3527"/>
  <circle cx="80" cy="88" r="2.2" fill="#ffffff"/>
  <circle cx="124" cy="88" r="2.2" fill="#ffffff"/>

  <!-- eyebrows -->
  <path d="M70 77q7-5 14-1" stroke="#c9922f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M130 77q-7-5-14-1" stroke="#c9922f" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
